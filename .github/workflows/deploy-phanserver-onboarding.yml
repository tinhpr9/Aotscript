name: One-shot Deploy Phanserver Onboarding

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phanserver-delta-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact phanserver-delta commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tinhpr9/phanserver-delta
          ref: b8d333c2b52cfbd412c99a31c1ce66cad47c4282
          path: phanserver-delta
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Run exact commit regression suite
        working-directory: phanserver-delta
        run: |
          chmod +x tests/run_all_tests.sh
          ./tests/run_all_tests.sh

      - name: Deploy existing phanserver-delta Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: phanserver-delta
          command: deploy --config wrangler.jsonc

      - name: Verify deployed Worker boundary
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 \
            https://phanserver-delta-worker.tinh1020pr.workers.dev/health \
            | grep -F '"status":"healthy"'
          code="$(curl -sS -o /tmp/public-state.json -w '%{http_code}' \
            https://phanserver-delta-worker.tinh1020pr.workers.dev/aot/hub/state)"
          test "$code" = "404"
          grep -F '"error":"not_found"' /tmp/public-state.json

      - name: List configured Worker secret names
        working-directory: phanserver-delta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler secret list --config wrangler.jsonc
