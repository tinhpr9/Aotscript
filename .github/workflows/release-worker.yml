name: Release AOT Worker

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact worker version without prefixes
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: worker-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Validate version and run self-tests
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$RELEASE_VERSION" = "2026.08.11.8"
          grep -Fq 'WORKER_VERSION = "aot-worker-'"$RELEASE_VERSION"'"' aot-group-control/relay.py
          python3 - "$RELEASE_VERSION" <<'PY'
          import json, pathlib, sys
          expected = "aot-worker-" + sys.argv[1]
          for channel in ("canary", "stable"):
              data = json.loads(pathlib.Path(f"aot-group-control/worker-manifest-{channel}.json").read_text())
              assert data["version"] == expected and data["channel"] == channel
          PY
          python3 -m py_compile aot-group-control/*.py scripts/build-worker-release.py
          for test in aot-group-control/*selftest.py; do timeout 180 python3 "$test"; done
          node --experimental-vm-modules cloudflare-worker/fleet-state-selftest.mjs
          node --experimental-vm-modules cloudflare-worker/aot-hub-session-selftest.mjs
          python3 -m unittest discover -s tests -v
          timeout 300 bash tests/setup-self-test.sh

      - name: Fail if tag or release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: worker-v${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then exit 31; fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then exit 32; fi

      - name: Build immutable assets once
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/build-worker-release.py --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --output dist

      - name: Require immutable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq .enabled)" = true

      - name: Create draft, upload once, verify, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: worker-v${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AOT Worker ${RELEASE_VERSION}" --notes "Immutable AOT Worker ${RELEASE_VERSION}" --draft
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > release.json
          python3 - "$GITHUB_SHA" "$TAG" dist release.json <<'PY'
          import hashlib, json, pathlib, sys
          commit, tag, folder, response = sys.argv[1:]
          data = json.loads(pathlib.Path(response).read_text())
          assert data["draft"] is True and data["tag_name"] == tag
          assert data["target_commitish"] == commit
          local = {p.name: (p.stat().st_size, hashlib.sha256(p.read_bytes()).hexdigest()) for p in pathlib.Path(folder).iterdir()}
          remote = {a["name"]: (a["size"], str(a.get("digest") or "").removeprefix("sha256:")) for a in data["assets"]}
          assert local == remote, (local, remote)
          PY
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > published.json
          python3 - "$GITHUB_SHA" "$TAG" published.json <<'PY'
          import json, pathlib, sys
          commit, tag, response = sys.argv[1:]
          data = json.loads(pathlib.Path(response).read_text())
          assert data["draft"] is False and data["tag_name"] == tag
          assert data["target_commitish"] == commit and data.get("immutable") is True
          assert len(data["assets"]) >= 3
          PY
