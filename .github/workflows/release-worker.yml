name: Release AOT Worker

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact worker version without prefixes
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: worker-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Validate version and run self-tests
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$RELEASE_VERSION" = "2026.08.11.8"
          grep -Fq 'WORKER_VERSION = "aot-worker-'"$RELEASE_VERSION"'"' aot-group-control/relay.py
          python3 - "$RELEASE_VERSION" <<'PY'
          import json, pathlib, sys
          expected = "aot-worker-" + sys.argv[1]
          for channel in ("canary", "stable"):
              data = json.loads(pathlib.Path(f"aot-group-control/worker-manifest-{channel}.json").read_text())
              assert data["version"] == expected and data["channel"] == channel
          PY
          python3 -m py_compile aot-group-control/*.py scripts/build-worker-release.py scripts/verify_worker_release.py
          for test in aot-group-control/*selftest.py; do timeout 180 python3 "$test"; done
          node --experimental-vm-modules cloudflare-worker/fleet-state-selftest.mjs
          node --experimental-vm-modules cloudflare-worker/aot-hub-session-selftest.mjs
          python3 -m unittest discover -s tests -v
          timeout 300 bash tests/setup-self-test.sh

      - name: Fail if tag or release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: worker-v${{ inputs.version }}
        run: |
          set -euo pipefail
          check_absent() {
            local label="$1" endpoint="$2" status
            if ! status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/${endpoint}")"; then
              echo "GitHub API transport failed for ${label}" >&2
              return 70
            fi
            python3 scripts/verify_worker_release.py require-absent "$label" "$status"
          }
          check_absent tag "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}"
          check_absent release "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"

      - name: Build immutable assets once
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/build-worker-release.py --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --output dist

      - name: Create draft, upload once, verify, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: worker-v${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AOT Worker ${RELEASE_VERSION}" --notes "Immutable AOT Worker ${RELEASE_VERSION}" --draft
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > release.json
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > release-ref.json
          python3 scripts/verify_worker_release.py verify \
            "$GITHUB_SHA" "$TAG" dist release.json release-ref.json draft
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > published.json
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > published-ref.json
          python3 scripts/verify_worker_release.py verify \
            "$GITHUB_SHA" "$TAG" dist published.json published-ref.json published release.json
